services:
  redis:
    image: redis:7-alpine
    container_name: jevbeez-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: jevbeez-api
    ports:
      - "8080:8080"
    env_file:
      - ./apps/api/.env
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: jevbeez-web
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
